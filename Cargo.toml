[package]
name = "os3"
version = "0.1.0"
edition = "2021"
description = "OS3 Browser CLI - interactive S3/MinIO TUI browser"

[[bin]]
name = "os3"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "io-util"] }
futures = "0.3"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
anyhow = "1"
urlencoding = "2"
ratatui-image = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
